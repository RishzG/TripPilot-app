# Money import boundary (plan 01-03; D-53, D-54).
#
# import-linter errors on a missing internal module, so this file names only packages that
# exist today: trippilot.contracts and trippilot.payments. Plan 01-08 (wave 7) extends it once
# auth, demo, trips, realtime, admin and jobs exist: it adds the contract forbidding those
# packages from importing trippilot.payments.client / .token_cache / .vault_store and widens
# `contracts-are-leaf` to them and trippilot.db. Until then
# tests/unit/test_import_boundaries.py also scans every module outside trippilot.payments.
[importlinter]
root_package = trippilot

[importlinter:contract:contracts-are-leaf]
name = Contracts are a leaf: they must not import payments
type = forbidden
source_modules =
    trippilot.contracts
forbidden_modules =
    trippilot.payments
