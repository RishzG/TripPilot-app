# Money import boundary (plans 01-03 and 01-08; D-53, D-54).
#
# import-linter errors on a missing internal module, so this file names only packages that
# exist. Run it with `uv run lint-imports --config importlinter.ini`;
# tests/unit/test_import_boundaries.py runs it inside pytest and also scans every module outside
# trippilot.payments. include_external_packages is required by the cryptography contract.
[importlinter]
root_package = trippilot
include_external_packages = True

[importlinter:contract:contracts-are-leaf]
name = Contracts are a leaf: they must not import payments or any feature package
type = forbidden
source_modules =
    trippilot.contracts
forbidden_modules =
    trippilot.payments
    trippilot.auth
    trippilot.trips
    trippilot.realtime
    trippilot.demo
    trippilot.admin
    trippilot.jobs
    trippilot.db

# Only trippilot.payments may touch PayPal I/O: other packages get the gateway through
# `get_paypal_gateway()` (trippilot.payments) and the Protocol in trippilot.contracts.
# Indirect imports are allowed: app.py reaches payments.client through trippilot.payments.
[importlinter:contract:payments-io-boundary]
name = Only trippilot.payments imports the PayPal client, token cache or vault store
type = forbidden
source_modules =
    trippilot.auth
    trippilot.trips
    trippilot.realtime
    trippilot.demo
    trippilot.admin
    trippilot.jobs
    trippilot.health
    trippilot.db
    trippilot.app
forbidden_modules =
    trippilot.payments.client
    trippilot.payments.token_cache
    trippilot.payments.vault_store
allow_indirect_imports = True

# `cryptography` is imported only inside trippilot.payments (in practice only vault_store.py; the
# pytest source scan pins that exact file).
[importlinter:contract:cryptography-only-in-payments]
name = Only trippilot.payments imports cryptography
type = forbidden
source_modules =
    trippilot.auth
    trippilot.trips
    trippilot.realtime
    trippilot.demo
    trippilot.admin
    trippilot.jobs
    trippilot.health
    trippilot.db
    trippilot.contracts
    trippilot.app
    trippilot.settings
    trippilot.log_config
    trippilot.web_static
forbidden_modules =
    cryptography
include_external_packages = True
allow_indirect_imports = True
