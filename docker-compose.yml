# Local development stack (plan 01-19). 01-24 adds the app and worker services.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trippilot
    ports:
      - '5432:5432'
    volumes:
      - trippilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trippilot']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  trippilot_pgdata:
